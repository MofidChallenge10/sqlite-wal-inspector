[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sqlite-wal-inspector"
version = "1.0.0"
description = "Inspect SQLite write-ahead log frames"
requires-python = ">=3.10"
[project.scripts]
sqlite_wal_inspector = "sqlite_wal_inspector.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
